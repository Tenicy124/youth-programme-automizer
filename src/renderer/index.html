<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Youth Programme Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

        <div><div class="brand-name">Programme Studio</div><div class="brand-sub">Youth programme planner</div></div>

      <div class="sidebar-foot" id="aiStatus"></div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <div id="print" class="print-only"></div>
  <script src="../shared/search.js"></script>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
