name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build universal .dmg and .zip (Apple Silicon + Intel)
        run: npm run dist:mac
      - name: Verify the app is signed
        run: codesign --verify --deep --verbose=2 "dist/mac-universal/Youth Programme Studio.app"
      - uses: actions/upload-artifact@v4
        with:
          name: youth-programme-studio-mac
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Read version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release for this version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Youth Programme Studio ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.dmg
            dist/*.zip
          body: |
            Download the **.dmg** file below, open it and drag the app into Applications. Works on Apple Silicon and Intel Macs.

            First launch: macOS will say the app is from an unidentified developer. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** (once only).
